[project]
name = "latent-mischief"
version = "0.1.0"
description = "Small models. Strange behaviors. Reproducible experiments."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.8,<3",
  "transformers>=5.12.1,<6",
  "accelerate>=1,<2",
  "huggingface-hub>=0.34,<2",
  "safetensors>=0.6",
  "psutil>=7,<8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
